# ============================================================================
# GITHUB ACTIONS WORKFLOW: PLAYWRIGHT AUTOMATED E2E & API TEST SUITE
# ============================================================================
# This workflow executes Playwright test suites on code pushes, pull requests,
# or external API triggers (repository_dispatch), and dispatches automated
# ChatOps reports to Slack via SlackReporter.
# ============================================================================

name: Playwright Tests

# ----------------------------------------------------------------------------
# TRIGGER EVENTS
# ----------------------------------------------------------------------------
on:
  # Trigger on pushes to production branches
  push:
    branches: [ main, master ]
    
  # Trigger on Pull Requests targeting production branches
  pull_request:
    branches: [ main, master ]
    
  # Enable external webhook execution via GitHub API (e.g., post-deployment triggers)
  repository_dispatch:
    types: [ run-smoke-tests ]

# ----------------------------------------------------------------------------
# CONCURRENCY CONTROL
# ----------------------------------------------------------------------------
# Automatically cancel prior in-flight workflow runs on the same branch when new code is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ----------------------------------------------------------------------------
# JOBS DEFINITION
# ----------------------------------------------------------------------------
jobs:
  test:
    name: Run E2E & API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code into the CI runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment using LTS version
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm' # Caches npm packages to speed up pipeline execution

      # Step 3: Clean install project npm dependencies
      - name: Install Node Dependencies
        run: npm ci

      # Step 4: Install required browser binaries and OS-level system dependencies
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      # Step 5: Execute Playwright test suite with injected Slack secrets
      - name: Run Playwright Test Suite
        env:
          # Injects Slack Bot Token required by Slack WebClient in slack-reporter.ts
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          
          # Injects target Slack Channel ID where alerts and summaries are posted
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          
          # Sets execution environment dynamically (defaults to 'production')
          NODE_ENV: ${{ github.event.client_payload.environment || 'staging' }}
          TEST_ENV: ${{ github.event.client_payload.environment || 'staging' }}
          
        # Passing --project ensures Playwright populates test.projectName accurately 
        # Added --update-snapshots to auto-generate baseline images in Linux CI
        run: npx playwright test --project=api --project=e2e --update-snapshots

      # Step 6: Upload Playwright HTML report & trace artifacts upon failure or pass
      - name: Upload Test Report & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14